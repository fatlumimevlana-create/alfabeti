<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mësojmë Orën - Gara e Akrepave</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1976d2;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box {
      background: white;
      color: #0d47a1;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .clock {
      width: 180px;
      height: 180px;
      border: 6px solid #b78103;
      border-radius: 50%;
      position: relative;
      background: #fcf8e3;
      margin: 0 auto 20px auto;
    }
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      border-radius: 4px;
    }
    .hour { width: 5px; height: 45px; background: #0d47a1; margin-left: -2.5px; }
    .minute { width: 3px; height: 65px; background: #2e7d32; margin-left: -1.5px; }
    .dot {
      position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px; background: #b78103;
      border-radius: 50%; transform: translate(-50%, -50%);
    }
    .buttons {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      gap: 10px;
    }
    button {
      font-size: 1.4rem;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background-color: #ff9100;
      color: white;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
    }
    button:hover { background-color: #ffc400; color: #0d47a1; }
    .correct { background-color: #00e676 !important; }
    .wrong { background-color: #ff5252 !important; }
    .status { margin-top: 15px; font-size: 1.1rem; font-weight: bold; color: #333; }
  </style>
</head>
<body>

  <div class="box">
    <h2 style="margin-bottom: 10px; color: #1976d2;">Sa është ora?</h2>
    
    <div class="clock">
      <div class="hand hour" id="hourHand"></div>
      <div class="hand minute" id="minuteHand"></div>
      <div class="dot"></div>
    </div>

    <div class="buttons" id="buttonContainer">
      <!-- Butonat do të shfaqen automatikisht këtu -->
    </div>
    
    <div class="status" id="statusText"></div>
  </div>

  <script>
    // Lista e pyetjeve: këndet e orës (hourDeg, minDeg) dhe përgjigjja e saktë me opsionet
    const pyetjet = [
      { hDeg: 90,  mDeg: 0,   sakte: "Ora 3:00", opsione: ["Ora 3:00", "Ora 6:00"] },
      { hDeg: 180, mDeg: 0,   sakte: "Ora 6:00", opsione: ["Ora 12:00", "Ora 6:00"] },
      { hDeg: 270, mDeg: 0,   sakte: "Ora 9:00", opsione: ["Ora 9:00", "Ora 3:00"] },
      { hDeg: 0,   mDeg: 0,   sakte: "Ora 12:00", opsione: ["Ora 12:00", "Ora 6:00"] },
      { hDeg: 135, mDeg: 0,   sakte: "Ora 4:30", opsione: ["Ora 4:30", "Ora 10:15"] }
    ];

    let currentIndex = 0;

    function ngarkoPyetjen() {
      if (currentIndex >= pyetjet.length) {
        currentIndex = 0; // Kthehet te e para nëse mbarojnë
      }

      let p = pyetjet[currentIndex];
      
      // Vendos akrepat
      document.getElementById("hourHand").style.transform = `rotate(${p.hDeg}deg)`;
      document.getElementById("minuteHand").style.transform = `rotate(${p.mDeg}deg)`;
      document.getElementById("statusTextinnerText = "";

      let btnContainer = document.getElementById("buttonContainer");
      btnContainer.innerHTML = "";

      // Përziejmë opsionet që të ndryshojnë vendet
      let opsionetAktuale = [...p.opsione].sort(() => Math.random() - 0.5);

      opsionetAktuale.forEach(opsioni => {
        let btn = document.createElement("button");
        btn.innerText = opsioni;
        btn.onclick = () => verifiko(opsioni, p.sakte, btn);
        btnContainer.appendChild(btn);
      });
    }

    function verifiko(zgjedhja, eSakte, btn) {
      let status = document.getElementById("statusText");
      if (zgjedhja === eSakte) {
        btn.classList.add("correct");
        status.style.color = "#2e7d32";
        status.innerText = "Bravo! Përgjigjja e saktë! 🎉";
        
        setTimeout(() => {
          currentIndex++;
          ngarkoPyetjen();
        }, 1500);
      } else {
        btn.classList.add("wrong");
        status.style.color = "#d32f2f";
        status.innerText = "Provo përsëri! ❌";
        setTimeout(() => {
          btn.classList.remove("wrong");
        }, 500);
      }
    }

    // Nis lojën
    ngarkoPyetjen();
  </script>

</body>
</html>
