<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mësojmë Orën - Loja e Dijes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: white;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3vh;
      overflow: hidden;
    }
    .header { font-size: 1.3rem; font-weight: bold; color: #ffd166; margin-bottom: 2vh;}

    .game-box {
      background-color: white;
      color: #0d47a1;
      padding: 4vh;
      border-radius: 2rem;
      box-shadow: 0 1vh 3vh rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .imazhi-ora { font-size: 7rem; margin-bottom: 1vh; }
    .pyetja-ora { font-size: 2.2rem; font-weight: bold; margin-bottom: 3vh; color: #1976d2; }

    .opsionet {
      display: flex;
      justify-content: center;
      gap: 3vh;
      width: 100%;
      flex-wrap: wrap;
    }
    button {
      font-size: 2.2rem;
      padding: 2.5vh 3vh;
      border: none;
      border-radius: 1rem;
      background-color: #ff9100;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.3);
      transition: 0.2s;
      width: 42%;
    }
    button:hover, button:focus {
      background-color: #ffc400;
      color: #0d47a1;
      outline: none;
      transform: scale(1.05);
    }
    .mesazhi-fiks { font-size: 1rem; color: #bbdefb; margin-top: 2vh; }

    @keyframes pulso {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .saktesisht {
      animation: pulso 0.5s ease;
      background-color: #00e676 !important;
      color: white !important;
    }
  </style>
</head>
<body>

  <div class="header">⏰ Gara e Orës ⏰</div>

  <div class="game-box" id="game-container">
    <div class="imazhi-ora" id="ora-emoji">🕒</div>
    <div class="pyetja-ora" id="ora-tekst">Sa është ora?</div>
    <div class="opsionet" id="options-container"></div>
  </div>

  <div class="mesazhi-fiks">Prekni kohën e saktë me gisht!</div>

  <script>
    const listaPyetjeveOr=. [
      { emoji: "🕒", pyetje: "Ora 3:00", saktë: "Ora 3:00", opsionet: ["Ora 3:00", "Ora 9:00"] },
      { emoji: "🕕", pyetje: "Ora 6:00", saktë: "Ora 6:00", opsionet: ["Ora 6:00", "Ora 12:00"] },
      { emoji: "🕛", pyetje: "Ora 12:00", saktë: "Ora 12:00", opsionet: ["Ora 12:00", "Ora 1:00"] },
      { emoji: "🕘", pyetje: "Ora 9:00", saktë: "Ora 9:00", opsionet: ["Ora 9:00", "Ora 4:00"] },
      { emoji: "🕞", pyetje: "Ora 3:30", saktë: "Ora 3:30", opsionet: ["Ora 3:30", "Ora 6:30"] }
    ];

    let currentIndex = 0;

    function ngarkoPyetjenOres() {
      if (currentIndex < listaPyetjeveOr.length) {
        let p = listaPyetjeveOr[currentIndex];
        document.getElementById("ora-emoji").innerText = p.emoji;
        document.getElementById("ora-tekst").innerText = p.pyetje;

        let optBox = document.getElementById("options-container");
        optBox.innerHTML = "";

        p.opsionet.forEach((opsioni) => {
          let btn = document.createElement("button");
          btn.innerText = opsioni;
          btn.onclick = () => verifikoOren(opsioni, btn);
          optBox.appendChild(btn);
        });
      } else {
        akesoFundiOres();
      }
    }

    function verifikoOren(zgjedhja, btnElement) {
      let p = listaPyetjeveOr[currentIndex];
      if (zgjedhja === p.saktë) {
        btnElement.classList.add("saktesisht");

        let allButtons = document.querySelectorAll("#options-container button");
        allButtons.forEach(b => b.onclick = null);

        setTimeout(() => {
          currentIndex++;
          ngarkoPyetjenOres();
        }, 1500);

      } else {
        btnElement.style.backgroundColor = "#ff5252";
        setTimeout(() => { btnElement.style.backgroundColor = "#ff9100"; }, 300);
      }
    }

    function akesoFundiOres() {
      let box = document.getElementById("game-container");
      box.innerHTML = `<div style="font-size: 2.5rem; color: #0d47a1; font-weight: bold;">🎉 Urime!<br>E mësove orën për mrekulli!</div><div style="margin-top:3vh; font-size: 1.2rem; color: #555;">Rinis pas pak...</div>`;
       setTimeout(() => {
        currentIndex = 0;
        box.innerHTML = `
          <div class="imazhi-ora" id="ora-emoji">🕒</div>
          <div class="pyetja-ora" id="ora-tekst">Sa është ora?</div>
          <div class="opsionet" id="options-container"></div>
        `;
        ngarkoPyetjenOres();
       }, 4000);
    }

    ngarkoPyetjenOres();
  </script>
</body>
</html>
