<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja e Dijes - Klasa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-size: 1.8rem; /* Përshtatet automatikisht me ekranin */
      background: linear-gradient(135deg, #1f4068, #162447);
      color: white;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3vh;
      overflow: hidden;
    }
    .header { font-size: 1.2rem; font-weight: bold; color: #e43f5a; }
    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2vh;
      width: 100%;
      max-width: 900px;
    }
    .question { font-size: 1.6rem; text-align: center; font-weight: bold; }
    .options { display: flex; flex-direction: column; gap: 2vh; width: 100%; }
    button {
      font-size: 1.2rem;
      padding: 2.5vh;
      border: none;
      border-radius: 1rem;
      background-color: #ffffff;
      color: #162447;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.3);
      transition: 0.2s;
    }
    button:hover, button:focus {
      background-color: #e43f5a;
      color: white;
      outline: none;
      transform: scale(1.02);
    }
    .score-board { font-size: 1.3rem; color: #ffd166; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">Gara e Dijes në Klasë 🏆</div>

  <div class="box" id="game-container">
    <div class="score-board" id="score">Pikët: 0</div>
    <div class="question" id="question-text">Duke u përgatitur...</div>
    <div class="options" id="options-container"></div>
  </div>

  <div style="font-size: 0.9rem; color: #adb5bd;">Prekni me gisht për të dhënë përgjigjen!</div>

  <script>
    const pyetjetDheGara = [
      {
        pyetja: "Cila ngjyrë është flamuri ynë kuq e zi?",
        opsionet: ["🔴 E Kuqe dhe E Zezë", "🔵 E Kaltër dhe E Bardhë", "🟡 E Verdhë dhe Jeshile"],
        saktë: 0
      },
      {
        pyetja: "Sa bëjnë 3 plus 2?",
        opsionet: ["4", "5", "6"],
        saktë: 1
      },
      {
        pyetja: "Cila kafshë na jep qumësht?",
        opsionet: ["🐈 Macja", "🐄 Lopa", "🦁 Luani"],
        saktë: 1
      },
      {
        pyetja: "Cila shkronjë vjen e para në abetare?",
        opsionet: ["B", "A", "M"],
        saktë: 1
      }
    ];

    let currentIndex = 0;
    let score = 0;

    function ngarkoPyetjen() {
      if (currentIndex < pyetjetDheGara.length) {
        let q = pyetjetDheGara[currentIndex];
        document.getElementById("question-text").innerText = `Pyetja ${currentIndex + 1}: ${q.pyetja}`;
        document.getElementById("score").innerText = `Pikët: ${score}`;
        
        let optBox = document.getElementById("options-container");
        optBox.innerHTML = "";
        
        q.opsionet.forEach((opsioni, idx) => {
          let btn = document.createElement("button");
          btn.innerText = opsioni;
          btn.onclick = () => verifiko(idx);
          optBox.appendChild(btn);
        });
      } else {
        akesoFundi();
      }
    }

    function verifiko(zgjedhja) {
      if (zgjedhja === pyetjetDheGara[currentIndex].saktë) {
        score += 10;
      }
      currentIndex++;
      ngarkoPyetjen();
    }

    function akesoFundi() {
      let box = document.getElementById("game-container");
      box.innerHTML = `<div style="font-size: 2rem; text-align: center; color: #ffd166;">🎉 Urime! Përfundoi Gara!<br>Pikët Totale: ${score}</div>`;
    }

    ngarkoPyetjen();
  </script>
</body>
</html>
