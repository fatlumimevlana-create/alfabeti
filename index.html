<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gjeje Shkronjën e Fshehur - Loja e Dijes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #4a148c, #7c4dff);
      color: white;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3vh;
      overflow: hidden;
    }
    .header { font-size: 1.3rem; font-weight: bold; color: #ffd166; margin-bottom: 2vh;}

    .game-box {
      background-color: white;
      color: #4a148c;
      padding: 5vh;
      border-radius: 2rem;
      box-shadow: 0 1vh 3vh rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .imazhi { font-size: 8rem; margin-bottom: 2vh; }
    .fjala { font-size: 4rem; font-weight: bold; letter-spacing: 0.3rem; margin-bottom: 4vh; color: #7c4dff;}
    .vija { 
      display: inline-block;
      min-width: 2rem;
      border-bottom: 0.4rem solid #7c4dff;
      color: #00e676; 
    }

    .opsionet {
      display: flex;
      justify-content: center;
      gap: 3vh;
      width: 100%;
      flex-wrap: wrap;
    }
    button {
      font-size: 3rem;
      padding: 3vh 5vh;
      border: none;
      border-radius: 1rem;
      background-color: #ff9100;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.3);
      transition: 0.2s;
      width: 40%;
    }
    button:hover, button:focus {
      background-color: #ffc400;
      color: #4a148c;
      outline: none;
      transform: scale(1.05);
    }
    .mesazhi-fiks { font-size: 1rem; color: #d1c4e9; margin-top: 2vh; }

    @keyframes pulso {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .saktesisht {
      animation: pulso 0.5s ease;
      background-color: #00e676 !important;
      color: white !important;
    }
  </style>
</head>
<body>

  <div class="header">🏆 Gara e Shkronjave 🏆</div>

  <div class="game-box" id="game-container">
    <div class="imazhi" id="figure-image">🍎</div>
    <div class="fjala"><span class="vija" id="shkronja-slot">_</span><span id="pjesa-tjeter">ollë</span></div>
    <div class="opsionet" id="options-container"></div>
  </div>

  <div class="mesazhi-fiks">Prekni shkronjën e duhur me gisht!</div>

  <script>
    const listaPyetjeve = [
      { imazhi: "🍎", prapashtesa: "ollë", shkronjaSakte: "M", opsionet: ["M", "P"] },
      { imazhi: "🐄", prapashtesa: "opë", shkronjaSakte: "L", opsionet: ["K", "L"] },
      { imazhi: "⚽", prapashtesa: "op", shkronjaSakte: "T", opsionet: ["T", "B"] },
      { imazhi: "🐟", prapashtesa: "eshkë", shkronjaSakte: "P", opsionet: ["P", "F"] }
    ];

    let currentIndex = 0;

    function ngarkoPyetjen() {
      if (currentIndex < listaPyetjeve.length) {
        let p = listaPyetjeve[currentIndex];
        document.getElementById("figure-image").innerText = p.imazhi;
        let slot = document.getElementById("shkronja-slot");
        slot.innerText = "_";
        slot.style.color = "#00e676";
        document.getElementById("pjesa-tjeter").innerText = p.prapashtesa;

        let optBox = document.getElementById("options-container");
        optBox.innerHTML = "";

        p.opsionet.forEach((opsioni) => {
          let btn = document.createElement("button");
          btn.innerText = opsioni;
          btn.onclick = () => verifiko(opsioni, btn);
          optBox.appendChild(btn);
        });
      } else {
        akesoFundi();
      }
    }

    function verifiko(zgjedhja, btnElement) {
      let p = listaPyetjeve[currentIndex];
      if (zgjedhja === p.shkronjaSakte) {
        let slot = document.getElementById("shkronja-slot");
        slot.innerText = zgjedhja; 
        btnElement.classList.add("saktesisht");

        let allButtons = document.querySelectorAll("#options-container button");
        allButtons.forEach(b => b.onclick = null);

        setTimeout(() => {
          currentIndex++;
          ngarkoPyetjen();
        }, 1500);

      } else {
        btnElement.style.backgroundColor = "#ff5252";
        setTimeout(() => { btnElement.style.backgroundColor = "#ff9100"; }, 300);
      }
    }

    function akesoFundi() {
      let box = document.getElementById("game-container");
      box.innerHTML = `<div style="font-size: 2.5rem; color: #4a148c; font-weight: bold;">🎉 Urime! I gjete të gjitha!<br>Shkëlqyeshëm!</div><div style="margin-top:3vh; font-size: 1.2rem;">Rinis pas pak...</div>`;
       setTimeout(() => {
        currentIndex = 0;
        box.innerHTML = `
          <div class="imazhi" id="figure-image">🍎</div>
          <div class="fjala"><span class="vija" id="shkronja-slot">_</span><span id="pjesa-tjeter">ollë</span></div>
          <div class="opsionet" id="options-container"></div>
        `;
        ngarkoPyetjen();
       }, 4000);
    }

    ngarkoPyetjen();
  </script>
</body>
</html>
