<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Mësojmë Alfabetin - A</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
        }
        .letter-card {
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            background-color: white;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.1);
            max-width: 300px;
        }
        .letter-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .letter-image {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .letters-display {
            font-size: 48px;
            font-weight: bold;
            color: #e74c3c; /* Ngjyrë e kuqe si molla */
        }
        .small-letter {
            margin-left: 10px;
            color: #3498db;
        }
    </style>
</head>
<body>

    <div class="letter-card">
        <div class="letter-title">Molla</div>
        <!-- SIGUROHUNI QË FOTOJA TË QUHET SAKTËSISHT "molla.jpg" DHE NDODHET NË TË NJËJTËN DOSJE -->
        <img src="molla.jpg" alt="Foto e një molle të kuqe" class="letter-image">
        <div class="letters-display">
            <span class="big-letter">A</span>
            <span class="small-letter">a</span>
        </div>
    </div>

    <p>Ky është një shembull për shkronjën A.</p>

</body>
</html>
