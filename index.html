<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mësojmë Alfabetin Shqip</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #1e88e5, #1565c0);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      text-align: center;
    }
    .container {
      background: white;
      color: #333;
      padding: 20px;
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }
    /* Ekrani i shfaqjes së shkronjës kur zgjidhet */
    .display-box {
      background: #f5f5f5;
      border: 4px solid #ffb300;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .display-letter {
      font-size: 4rem;
      font-weight: bold;
      color: #d32f2f;
      line-height: 1;
    }
    .display-word {
      font-size: 1.5rem;
      margin-top: 10px;
      color: #2e7d32;
      font-weight: bold;
    }
    /* Tabela e shkronjave */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    @media (max-width: 500px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    .letter-btn {
      background-color: #ff9100;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 12px 0;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .letter-btn:hover {
      background-color: #ffc400;
      color: #0d47a1;
      transform: scale(1.05);
    }
    .letter-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <h1>Mësojmë Alfabetin Shqip 📚</h1>

  <div class="container">
    <!-- Pjesa ku shfaqet shkronja e zgjedhur -->
    <div class="display-box" id="displayBox">
      <div class="display-letter" id="bigLetter">A</div>
      <div class="display-word" id="bigWord">A - Mollë 🍎</div>
    </div>

    <!-- Tabela e të gjitha shkronjave të alfabetit -->
    <div class="grid" id="alphabetGrid"></div>
  </div>

  <script>
    // Të dhënat e alfabetit shqip dhe nga një fjalë shembull për secilën shkronjë
    const alfabeti = [
      { shkronja: "A", fjala: "A - Mollë 🍎" },
      { shkronja: "B", fjala: "B - Bleta 🐝" },
      { shkronja: "C", fjala: "C - Cjapi 🐐" },
      { shkronja: "Ç", fjala: "Çanta 🎒" },
      { shkronja: "D", fjala: "D - Dhelpra 🦊" },
      { shkronja: "DH", fjala: "Dh - Dhia 🐐" },
      { shkronja: "E", fjala: "E - Elefanti 🐘" },
      { shkronja: "Ë", fjala: "Ë - Ëmbëlsirë 🧁" },
      { shkronja: "F", fjala: "F - Fara 🌻" },
      { shkronja: "G", fjala: "G - Gjel 🐓" },
      { shkronja: "GJ", fjala: "Gj - Gjelbërim 🌳" },
      { shkronja: "H", fjala: "H - Hëna 🌙" },
      { shkronja: "I", fjala: "I - Iloji 🧩" },
      { shkronja: "J", fjala: "J - Lujtur 🧸" },
      { shkronja: "K", fjala: "K - Kalë 🐴" },
      { shkronja: "L", fjala: "L - Luani 🦁" },
      { shkronja: "LL", fjala: "Ll - Llampë 💡" },
      { shkronja: "M", fjala: "M - Macja 🐱" },
      { shkronja: "N", fjala: "N - Njeriu 🧑" },
      { shkronja: "NJ", fjala: "Nj - Një 1️⃣" },
      { shkronja: "O", fjala: "O - Ora ⏰" },
      { shkronja: "P", fjala: "P - Pisha 🌲" },
      { shkronja: "Q", fjala: "Q - Qeni 🐶" },
      { shkronja: "R", fjala: "R - Rosa 🦆" },
      { shkronja: "RR", fjala: "Rr - Rrushi 🍇" },
      { shkronja: "S", fjala: "S - Dielli ☀️" },
      { shkronja: "SH", fjala: "Sh - Shkolla 🏫" },
      { shkronja: "T", fjala: "T - Tavolina 🪑" },
      { shkronja: "TH", fjala: "Th - Thelbi 🌰" },
      { shkronja: "U", fjala: "U - Ujku 🐺" },
      { shkronja: "V", fjala: "V - Vazo 🏺" },
      { shkronja: "X", fjala: "X - Xixë ✨" },
      { shkronja: "XH", fjala: "Xh - Xhirafë 🦒" },
      { shkronja: "Y", fjala: "Y - Ylli ⭐" },
      { shkronja: "Z", fjala: "Z - Zog 🐦" },
      { shkronja: "ZH", fjala: "Zh - Zhapik 🦎" }
    ];

    const grid = document.getElementById("alphabetGrid");
    const bigLetter = document.getElementById("bigLetter");
    const bigWord = document.getElementById("bigWord");

    // Funksioni për të lexuar me zë (Speech Synthesis në gjuhën shqipe)
    function lexoZej(teksti) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Ndalo zërat e mëparshëm
        let utterance = new SpeechSynthesisUtterance(teksti);
        utterance.lang = 'sq-AL'; // Gjuha Shqipe
        utterance.rate = 0.9; // Pak më ngadalë që të kuptohet bukur
        window.speechSynthesis.speak(utterance);
      }
    }

    // Mbushim tabelën me butonat e shkronjave automatikisht
    alfabeti.forEach(item => {
      let btn = document.createElement("button");
      btn.className = "letter-btn";
      btn.innerText = item.shkronja;
      
      btn.onclick = () => {
        bigLetter.innerText = item.shkronja;
        bigWord.innerText = item.fjala;
        
        // Lexon shkronjën dhe fjalën kur klikohet
        lexoZej(item.shkronja + ", " + item.fjala);
      };

      grid.appendChild(btn);
    });
  </script>

</body>
</html>
