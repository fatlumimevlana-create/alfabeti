<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Llogaritësi i Faturës së Ujit</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #eef2f7;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 1.5rem;
      color: #0f3d7c;
      line-height: 1.3;
    }
    .field-group {
      margin-bottom: 16px;
    }
    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }
    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1f2937;
    }
    .lock-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #0f3d7c;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .lock-btn:hover {
      background: #e2e8f0;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.05rem;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    input[type="number"]:focus {
      border-color: #1d4ed8;
    }
    input[type="number"]:read-only {
      background: #f1f5f9;
      color: #334155;
      border-color: #cbd5e1;
    }
    .hint {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
    }
    .calc-btn {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background: #154c9e;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 6px;
    }
    .calc-btn:hover {
      background: #0f3d7c;
    }
    .error {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      font-size: 0.9rem;
      display: none;
    }
    .result {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      display: none;
    }
    .result-title {
      font-weight: 700;
      font-size: 1rem;
      color: #0f3d7c;
      margin-bottom: 10px;
    }
    .line {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 0.95rem;
    }
    .divider {
      border: none;
      border-top: 1px solid #bfdbfe;
      margin: 10px 0;
    }
    .total {
      display: flex;
      justify-content: space-between;
      font-size: 1.15rem;
      font-weight: 800;
      color: #0f3d7c;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fatura e Ujit (KRU Gjakova)</h1>

    <div class="field-group">
      <div class="label-row">
        <label for="prevReading">Kubikazhi i fundit (m³):</label>
        <button type="button" id="toggleLockBtn" class="lock-btn">Ndrysho</button>
      </div>
      <input type="number" id="prevReading" step="any" min="0" placeholder="p.sh. 4015" readonly />
      <div id="lockStatus" class="hint">I kyçur dhe i ruajtur automatikisht.</div>
    </div>

    <div class="field-group">
      <div class="label-row">
        <label for="currReading">Kubikazhi aktual (m³):</label>
      </div>
      <input type="number" id="currReading" step="any" min="0" placeholder="p.sh. 4030" />
    </div>

    <button type="button" id="calcBtn" class="calc-btn">Llogarit Faturën</button>

    <div id="errorBox" class="error"></div>

    <div id="resultBox" class="result">
      <div id="resultTitle" class="result-title"></div>
      <div class="line"><span>Uji (0.52 €):</span><span id="waterCost"></span></div>
      <div class="line"><span>Kanalizimi (0.18 €):</span><span id="sewageCost"></span></div>
      <div class="line"><span>Tarifa fikse:</span><span>1.30 €</span></div>
      <div class="line"><span>Shuma neto:</span><span id="netCost"></span></div>
      <div class="line"><span>TVSH (8%):</span><span id="vatCost"></span></div>
      <hr class="divider" />
      <div class="total"><span>Totali për pagesë:</span><span id="totalCost"></span></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "kru_gjakova_last_kubik";

    const prevInput = document.getElementById("prevReading");
    const currInput = document.getElementById("currReading");
    const toggleLockBtn = document.getElementById("toggleLockBtn");
    const lockStatus = document.getElementById("lockStatus");
    const calcBtn = document.getElementById("calcBtn");
    const errorBox = document.getElementById("errorBox");
    const resultBox = document.getElementById("resultBox");

    const resultTitle = document.getElementById("resultTitle");
    const waterCostEl = document.getElementById("waterCost");
    const sewageCostEl = document.getElementById("sewageCost");
    const netCostEl = document.getElementById("netCost");
    const vatCostEl = document.getElementById("vatCost");
    const totalCostEl = document.getElementById("totalCost");

    let isLocked = true;

    function setLockedState(locked) {
      isLocked = locked;
      prevInput.readOnly = locked;
      if (locked) {
        toggleLockBtn.textContent = "Ndrysho";
        lockStatus.textContent = prevInput.value
          ? "I kyçur dhe i ruajtur automatikisht."
          : "I kyçur. Shtyp 'Ndrysho' për të futur kubikazhin fillestar.";
      } else {
        toggleLockBtn.textContent = "Kyç";
        lockStatus.textContent = "I zhbllokuar: shkruani vlerën dhe shtypni 'Kyç'.";
        prevInput.focus();
      }
    }

    // Ngarko kubikazhin e ruajtur kur hapet faqja
    const savedPrev = localStorage.getItem(STORAGE_KEY);
    if (savedPrev !== null && savedPrev !== "") {
      prevInput.value = savedPrev;
      setLockedState(true);
    } else {
      // Nëse është hera e parë, e lëmë të hapur që të shkruani kubikazhin e fundit (p.sh. 4015)
      setLockedState(false);
    }

    toggleLockBtn.addEventListener("click", () => {
      if (!isLocked) {
        const val = parseFloat(prevInput.value);
        if (!isNaN(val) && val >= 0) {
          localStorage.setItem(STORAGE_KEY, String(val));
        }
        setLockedState(true);
      } else {
        setLockedState(false);
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
      resultBox.style.display = "none";
    }

    function calculateBill() {
      errorBox.style.display = "none";

      const prevVal = parseFloat(prevInput.value);
      const currVal = parseFloat(currInput.value);

      if (isNaN(prevVal) || prevVal < 0) {
        showError("Ju lutem shkruani një vlerë të vlefshme për kubikazhin e fundit.");
        return;
      }

      if (isNaN(currVal) || currVal < 0) {
        showError("Ju lutem shkruani një vlerë të vlefshme për kubikazhin aktual.");
        return;
      }

      if (currVal < prevVal) {
        showError("Kubikazhi aktual nuk mund të jetë më i vogël se kubikazhi i fundit.");
        return;
      }

      const spentM3 = currVal - prevVal;
      const water = spentM3 * 0.52;
      const sewage = spentM3 * 0.18;
      const fixedFee = 1.30;
      const net = water + sewage + fixedFee;
      const vat = net * 0.08;
      const total = net + vat;

      resultTitle.textContent = `Për ${spentM3} kubikë (${prevVal} → ${currVal}):`;
      waterCostEl.textContent = `${water.toFixed(2)} €`;
      sewageCostEl.textContent = `${sewage.toFixed(2)} €`;
      netCostEl.textContent = `${net.toFixed(2)} €`;
      vatCostEl.textContent = `${vat.toFixed(2)} €`;
      totalCostEl.textContent = `${total.toFixed(2)} €`;
      resultBox.style.display = "block";

      // Përditëso kubikazhin e fundit me vlerën aktuale për muajin e ardhshëm
      localStorage.setItem(STORAGE_KEY, String(currVal));
      prevInput.value = String(currVal);
      currInput.value = "";
      setLockedState(true);
    }

    calcBtn.addEventListener("click", calculateBill);
    currInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        calculateBill();
      }
    });
  </script>
</body>
</html>
