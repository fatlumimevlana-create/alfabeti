<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>GPS Tracker - Rahovec</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f4f4f9;
        }

        h3 {
            text-align: center;
            color: #333;
        }

        #map {
            height: 450px;
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .alert-box {
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }

        .bg-danger {
            background-color: #ff4d4d;
            color: white;
        }

        .bg-success {
            background-color: #2ecc71;
            color: white;
        }

        .info-panel {
            font-size: 18px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>

<body>
    <h3>Sistemi i Navigimit GPS</h3>
    <div id="map"></div>

    <div class="info-panel">
        Shpejtësia: <span id="speed">--</span> km/h
    </div>

    <div id="alertBox" class="alert-box bg-success">Statusi: Duke kërkuar sinjalin...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script>
        // Inicializimi i hartës me server alternativ që nuk bllokohet
        var map = L.map('map').setView([42.4031, 20.6551], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap France | &copy; OpenStreetMap contributors'
        }).addTo(map);

        L.Control.geocoder({
            defaultMarkGeocode: true,
            placeholder: "Kërko vendin ose destinacionin..."
        }).addTo(map);

        var marker = L.marker([42.4031, 20.6551]).addTo(map);

        var latLngs = [];
        var polyline = L.polyline(latLngs, { color: 'blue', weight: 5 }).addTo(map);

        var ruga_rahovec_prizren = [
            { "lat": 42.4031, "lng": 20.6551, "shpejtesia": 50 },
            { "lat": 42.4051, "lng": 20.6581, "shpejtesia": 75 },
            { "lat": 42.4081, "lng": 20.6621, "shpejtesia": 80 },
            { "lat": 42.4111, "lng": 20.6651, "shpejtesia": 60 }
        ];
        var currentIndex = 0;

        var radaret = [
            { "lat": 42.4051, "lng": 20.6581 }
        ];

        function simulimLokacioni() {
            var data = ruga_rahovec_prizren[currentIndex];
            currentIndex = (currentIndex + 1) % ruga_rahovec_prizren.length;

            var currentLat = data.lat;
            var currentLng = data.lng;
            var shp = data.shpejtesia;
            var rehatiLatLon = [currentLat, currentLng];

            marker.setLatLng(rehatiLatLon);
            map.setView(rehatiLatLon, 14);

            document.getElementById('speed').innerText = shp;

            latLngs.push(rehatiLatLon);
            polyline.setLatLngs(latLngs);

            var afërRadar = false;
            radaret.forEach(function (rad) {
                var dist = Math.abs(rad.lat - currentLat) + Math.abs(rad.lng - currentLng);
                if (dist < 0.015) {
                    afërRadar = true;
                }
            });

            var alertBox = document.getElementById('alertBox');
            if (afërRadar && shp > 70) {
                alertBox.className = "alert-box bg-danger";
                alertBox.innerHTML = "⚠️ KUJDES RADAR! Shpejtësi e lartë!";
            } else {
                alertBox.className = "alert-box bg-success";
                alertBox.innerHTML = "Statusi: Rrugë e sigurt";
            }
        }

        setInterval(simulimLokacioni, 3000);
    </script>
</body>

</html>
